name: update omlxbar

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix
        required: true
        type: string
      tag:
        description: Git release tag
        required: true
        type: string
      asset_url:
        description: GitHub release asset URL
        required: true
        type: string
      sha256:
        description: Expected SHA-256 checksum
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-omlxbar
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ASSET_URL: ${{ inputs.asset_url }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release input and download
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use X.Y.Z format: $VERSION" >&2
            exit 1
          fi
          [ "$TAG" = "v$VERSION" ] || { echo "tag does not match version: $TAG" >&2; exit 1; }
          expected_url="https://github.com/propush/omlxbar/releases/download/$TAG/omlxbar-$VERSION-arm64.zip"
          [ "$ASSET_URL" = "$expected_url" ] || { echo "unexpected asset URL: $ASSET_URL" >&2; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid SHA-256 checksum" >&2; exit 1; }

          curl --fail --location --proto '=https' --tlsv1.2 "$ASSET_URL" --output "$RUNNER_TEMP/omlxbar.zip"
          actual_sha256="$(shasum -a 256 "$RUNNER_TEMP/omlxbar.zip" | awk '{print $1}')"
          [ "$actual_sha256" = "$EXPECTED_SHA256" ] || {
            echo "checksum mismatch: expected $EXPECTED_SHA256, got $actual_sha256" >&2
            exit 1
          }
      - name: Render cask
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Casks
          ruby <<'RUBY'
          version = ENV.fetch("VERSION")
          sha256 = ENV.fetch("EXPECTED_SHA256")
          File.write("Casks/omlxbar.rb", <<~CASK)
            cask "omlxbar" do
              version "#{version}"
              sha256 "#{sha256}"

              url "https://github.com/propush/omlxbar/releases/download/v\#{version}/omlxbar-\#{version}-arm64.zip"
              name "omlxbar"
              desc "Menu bar status and statistics for oMLX"
              homepage "https://github.com/propush/omlxbar"

              depends_on arch: :arm64
              depends_on macos: :sonoma

              app "omlxbar.app"

              zap trash: "~/Library/Preferences/com.pushkin.omlxbar.plist"

              caveats <<~EOS
                omlxbar is ad-hoc signed and is not notarized by Apple. To approve its first launch:

                  1. Run: open -a omlxbar
                  2. Open System Settings > Privacy & Security.
                  3. Click Open Anyway for omlxbar, then confirm Open.
              EOS
            end
          CASK
          RUBY
      - name: Audit cask
        shell: bash
        run: |
          set -euo pipefail
          brew style Casks/omlxbar.rb
          brew untap propush/tap 2>/dev/null || true
          brew tap-new propush/tap
          tap_dir="$(brew --repository propush/tap)"
          mkdir -p "$tap_dir/Casks"
          cp Casks/omlxbar.rb "$tap_dir/Casks/omlxbar.rb"
          brew audit --cask --strict propush/tap/omlxbar
      - name: Install and verify cask
        shell: bash
        run: |
          set -euo pipefail
          brew install --cask propush/tap/omlxbar
          # CI cannot complete macOS's interactive Open Anyway flow. Remove
          # quarantine only on this disposable runner so the artifact can be inspected.
          xattr -dr com.apple.quarantine /Applications/omlxbar.app
          plist=/Applications/omlxbar.app/Contents/Info.plist
          binary=/Applications/omlxbar.app/Contents/MacOS/omlxbar
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION" ]
          [ "$(lipo -archs "$binary")" = "arm64" ]
          codesign --verify --deep --strict /Applications/omlxbar.app
      - name: Uninstall test app
        if: always()
        run: brew uninstall --cask omlxbar || true
      - name: Commit cask update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/omlxbar.rb
          if git diff --cached --quiet; then
            echo "cask is already at $VERSION"
            exit 0
          fi
          git commit -m "omlxbar $VERSION"
          git push
